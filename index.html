<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Кристина и капибары в пустыне</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #e8d5b5;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #gameWrap {
    width: min(100vw, 960px);
    padding: 8px;
    position: relative;
  }
  #topbar {
    display: flex; gap: 8px; justify-content: space-between; align-items: center;
    background: rgba(255, 245, 225, 0.92);
    border-radius: 18px;
    padding: 12px 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    margin-bottom: 10px;
    flex-wrap: wrap;
    backdrop-filter: blur(4px);
  }
  #title { font-weight: 900; font-size: 18px; color: #5a3e2b; }
  .stat { font-weight: 700; color: #5a3e2b; font-size: 16px; }
  canvas {
    width: 100%;
    aspect-ratio: 16 / 10;
    display: block;
    border-radius: 22px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.3);
    background: #f5e6c8;
    touch-action: none;
    cursor: grab;
  }
  #hint {
    text-align: center;
    color: #4a3520;
    margin: 10px 0 0;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(255,215,140,0.6);
    font-size: 15px;
  }
  #modal {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(40, 30, 20, 0.7);
    backdrop-filter: blur(6px);
    z-index: 20;
    padding: 16px;
  }
  #card {
    width: min(92vw, 420px);
    background: #fffaf0;
    border-radius: 32px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    border: 2px solid #dbbd9a;
  }
  #card .emoji-big { font-size: 56px; }
  #example { font-size: 52px; font-weight: 900; margin: 16px 0; color: #3d2b1a; }
  #answer {
    width: 100%; font-size: 36px; text-align: center; padding: 14px;
    border: 3px solid #c4a27a; border-radius: 16px; outline: none;
    background: #fffdf8;
    font-weight: 700;
    color: #2f1f0e;
  }
  #check {
    margin-top: 18px; width: 100%; padding: 18px; border: 0; border-radius: 16px;
    background: #7b5f42; color: #fff; font-size: 22px; font-weight: 800;
    cursor: pointer; transition: 0.1s;
    box-shadow: 0 4px 0 #4d3824;
  }
  #check:active { transform: translateY(3px); box-shadow: 0 1px 0 #4d3824; }
  #message { min-height: 32px; margin-top: 14px; font-weight: 700; font-size: 20px; }
  .hidden { display: none !important; }

  #levelScreen .screenCard {
    background: #fcf3e4;
    border-radius: 32px;
    padding: 34px 24px;
    text-align: center;
    box-shadow: 0 16px 50px rgba(0,0,0,0.25);
    border: 2px solid #dbbd9a;
  }
  #levelScreen h1 { font-size: 26px; color: #4d3824; }
  #levelScreen p { font-size: 18px; color: #5a3e2b; }
  #numberChoices {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    margin-top: 24px;
  }
  #numberChoices button {
    width: 60px; height: 60px; border: 0; border-radius: 18px;
    background: #dbbd9a; color: #2f1f0e; font-size: 26px; font-weight: 800;
    box-shadow: 0 4px 0 #a58669; transition: 0.1s;
    touch-action: manipulation;
  }
  #numberChoices button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a58669; }

  #danceScreen .screenCard {
    background: #fcf3e4;
    border-radius: 32px;
    padding: 34px 20px;
    text-align: center;
    box-shadow: 0 16px 50px rgba(0,0,0,0.25);
    border: 2px solid #dbbd9a;
  }
  #danceScreen h1 { font-size: 26px; color: #4d3824; }
  #danceScreen p { font-size: 18px; color: #5a3e2b; }
  #danceScene {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 16px;
    font-size: 48px;
    margin: 24px 0;
    min-height: 130px;
  }
  .dancer { font-size: 68px; }
  .capy {
    display: inline-block;
    animation: danceWobble 1.0s infinite alternate ease-in-out;
    font-size: 52px;
  }
  .capy:nth-child(2) { animation-delay: 0.0s; }
  .capy:nth-child(3) { animation-delay: 0.15s; }
  .capy:nth-child(4) { animation-delay: 0.30s; }
  .capy:nth-child(5) { animation-delay: 0.45s; }
  .capy:nth-child(6) { animation-delay: 0.60s; }
  .capy:nth-child(7) { animation-delay: 0.75s; }
  @keyframes danceWobble {
    0% { transform: translateY(0) rotate(-5deg) scale(1); }
    100% { transform: translateY(-20px) rotate(5deg) scale(1.1); }
  }
  #nextLevel {
    margin-top: 20px; padding: 16px 44px; border: 0; border-radius: 40px;
    background: #7b5f42; color: #fff; font-size: 22px; font-weight: 800;
    box-shadow: 0 4px 0 #4d3824; transition: 0.1s;
    touch-action: manipulation;
  }
  #nextLevel:active { transform: translateY(3px); box-shadow: 0 1px 0 #4d3824; }

  #touchControls {
    display: none;
    margin: 16px auto 0;
    width: 240px;
    touch-action: none;
  }
  #touchControls button {
    width: 70px; height: 60px; margin: 4px; border: 0; border-radius: 18px;
    background: rgba(255, 245, 225, 0.92);
    color: #3d2b1a; font-size: 30px; font-weight: 900;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    touch-action: none;
    backdrop-filter: blur(4px);
    border: 1px solid #dbbd9a;
  }
  #touchControls button:active {
    transform: scale(0.90);
    background: #f0dec6;
  }
  .touchRow { display: flex; justify-content: center; }

  @media (max-width: 700px) {
    body { overflow: auto; }
    #gameWrap { padding: 4px; }
    #topbar { padding: 10px 14px; border-radius: 14px; gap: 4px; }
    #title { font-size: 16px; width: 100%; text-align: center; }
    .stat { font-size: 15px; }
    #hint { font-size: 14px; }
    #touchControls { display: block; }
    canvas { border-radius: 14px; }
    #card { padding: 24px 18px; }
    #example { font-size: 44px; }
    #answer { font-size: 32px; padding: 12px; }
    #check { font-size: 20px; padding: 16px; }
    #levelScreen h1 { font-size: 22px; }
    #levelScreen p { font-size: 16px; }
    #numberChoices button { width: 54px; height: 54px; font-size: 22px; }
    #danceScene { font-size: 40px; gap: 12px; }
    .dancer { font-size: 56px; }
    .capy { font-size: 44px; }
    #danceScreen h1 { font-size: 22px; }
    #danceScreen p { font-size: 16px; }
    #nextLevel { font-size: 19px; padding: 14px 32px; }
  }
</style>
</head>
<body>
<div id="gameWrap">
  <div id="topbar">
    <div id="title">🐹 Кристина и капибары</div>
    <div class="stat">Поймано: <span id="score">0</span>/10</div>
    <div class="stat">Уровень: <span id="level">—</span></div>
  </div>

  <div id="levelScreen">
    <div class="screenCard">
      <div style="font-size:56px;">🏜️🐹🏜️</div>
      <h1>Выбери таблицу умножения</h1>
      <p>Поймай 10 капибар, решая примеры!</p>
      <div id="numberChoices"></div>
    </div>
  </div>

  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">🐹 Подойди к капибаре и поймай её сачком</div>

  <div id="danceScreen" class="hidden">
    <div class="screenCard">
      <div id="danceScene">
        <span class="dancer">👩🏻</span>
        <span class="capy">🐹</span>
        <span class="capy">🐹</span>
        <span class="capy">🐹</span>
        <span class="capy">🐹</span>
        <span class="capy">🐹</span>
        <span class="capy">🐹</span>
      </div>
      <h1>🎉 Все капибары пойманы!</h1>
      <p>Кристина танцует, а капибары водят хоровод!</p>
      <button id="nextLevel">Следующий уровень →</button>
    </div>
  </div>

  <div id="touchControls" aria-label="Управление на телефоне">
    <button data-key="ArrowUp">▲</button>
    <div class="touchRow">
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowDown">▼</button>
      <button data-key="ArrowRight">▶</button>
    </div>
  </div>
</div>

<div id="modal" class="hidden">
  <div id="card">
    <div class="emoji-big">🐹</div>
    <div style="font-weight:700; color:#4d3824; font-size:18px;">Реши пример, чтобы поймать:</div>
    <div id="example"></div>
    <input id="answer" type="number" inputmode="numeric" autocomplete="off" placeholder="?" />
    <button id="check">Поймать!</button>
    <div id="message"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 600;
const keys = {};
let score = 0, activeFrog = null, question = null, caughtAnim = 0;
let selectedTable = null;
let capybaras = [];
const player = { x: W * 0.48, y: H * 0.62, speed: 260, dir: 1 };
document.getElementById('score').textContent = '0/10';

function spawnCapybara(i = 0, multiplier = 1) {
  let x, y;
  let attempts = 0;
  do {
    x = 60 + Math.random() * (W - 120);
    y = 140 + Math.random() * (H - 190);
    attempts++;
  } while (Math.hypot(x - player.x, y - player.y) < 160 && attempts < 50);
  return { x, y, phase: Math.random() * Math.PI * 2, id: i, multiplier };
}

function startLevel(n) {
  selectedTable = n;
  score = 0;
  document.getElementById('score').textContent = '0/10';
  document.getElementById('level').textContent = '×' + n;
  player.x = W * 0.48;
  player.y = H * 0.62;
  capybaras = Array.from({ length: 10 }, (_, i) => spawnCapybara(i, n));
  document.getElementById('levelScreen').classList.add('hidden');
  document.getElementById('game').style.visibility = 'visible';
  document.getElementById('danceScreen').classList.add('hidden');
  document.getElementById('modal').classList.add('hidden');
  activeFrog = null;
}

function finishLevel() {
  document.getElementById('game').style.visibility = 'hidden';
  document.getElementById('danceScreen').classList.remove('hidden');
}

function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
}

function drawDesert() {
  // Небо
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  grad.addColorStop(0, '#f7d9aa');
  grad.addColorStop(1, '#f5e6c8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.55);

  // Дюны
  ctx.fillStyle = '#e2c9a8';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.48);
  for (let x = 0; x <= W; x += 60) {
    ctx.quadraticCurveTo(x + 30, H * 0.38 + Math.sin(x * 0.02) * 30, x + 60, H * 0.48);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();

  ctx.fillStyle = '#dbbd9a';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.60);
  for (let x = 0; x <= W; x += 50) {
    ctx.quadraticCurveTo(x + 25, H * 0.52 + Math.sin(x * 0.025 + 2) * 25, x + 50, H * 0.60);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();

  ctx.fillStyle = '#c9ae8a';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.75);
  for (let x = 0; x <= W; x += 70) {
    ctx.quadraticCurveTo(x + 35, H * 0.68 + Math.sin(x * 0.018 + 4) * 20, x + 70, H * 0.75);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();

  // Кактусы и кустики
  for (let i = 0; i < 8; i++) {
    let x = (i * 137 + 43) % W;
    let y = H * 0.55 + (i * 73) % (H * 0.35);
    ctx.fillStyle = '#7a9b6e';
    ctx.beginPath();
    ctx.arc(x, y, 6 + i % 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8aaa7a';
    ctx.beginPath();
    ctx.arc(x + 8, y - 4, 5 + i % 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6a8a5e';
    ctx.beginPath();
    ctx.arc(x - 6, y - 2, 4 + i % 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Камешки
  for (let i = 0; i < 20; i++) {
    let x = (i * 97 + 13) % W;
    let y = H * 0.55 + (i * 53) % (H * 0.38);
    ctx.fillStyle = ['#b8a080', '#c8b090', '#a89078'][i % 3];
    ctx.beginPath();
    ctx.ellipse(x, y, 5 + i % 4, 3 + i % 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Следы на песке
  ctx.strokeStyle = 'rgba(160,130,100,0.2)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    let x = (i * 83 + 27) % W;
    let y = H * 0.6 + (i * 47) % (H * 0.32);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 1.5);
    ctx.stroke();
  }
}

function drawCapybara(c) {
  const bob = Math.sin(performance.now() / 280 + c.phase) * 3;
  const x = c.x, y = c.y + bob;
  ctx.save();
  ctx.translate(x, y);

  // Тень
  ctx.fillStyle = 'rgba(60,40,20,0.15)';
  ctx.beginPath();
  ctx.ellipse(0, 16, 22, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Тело
  ctx.fillStyle = '#8a7a5a';
  ctx.beginPath();
  ctx.ellipse(0, 2, 24, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#9a8a6a';
  ctx.beginPath();
  ctx.ellipse(0, -2, 20, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Голова
  ctx.fillStyle = '#9a8a6a';
  ctx.beginPath();
  ctx.ellipse(0, -12, 14, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Уши
  ctx.fillStyle = '#8a7a5a';
  ctx.beginPath();
  ctx.ellipse(-9, -18, 4, 3, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(9, -18, 4, 3, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Глаза
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(-5, -13, 2.2, 0, Math.PI * 2);
  ctx.arc(5, -13, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-4.5, -14, 1, 0, Math.PI * 2);
  ctx.arc(5.5, -14, 1, 0, Math.PI * 2);
  ctx.fill();

  // Нос
  ctx.fillStyle = '#5a4a3a';
  ctx.beginPath();
  ctx.ellipse(0, -8, 3, 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Улыбка
  ctx.strokeStyle = '#4a3a2a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -6, 4, 0.1, Math.PI - 0.1);
  ctx.stroke();

  // Лапки
  ctx.fillStyle = '#8a7a5a';
  ctx.beginPath();
  ctx.ellipse(-12, 8, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(12, 8, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawPlayer() {
  const x = player.x, y = player.y;
  ctx.save();
  ctx.translate(x, y);

  // Тень
  ctx.fillStyle = 'rgba(60,40,20,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 44, 26, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ноги
  ctx.strokeStyle = '#f5dcc8';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, 28);
  ctx.lineTo(-10, 42);
  ctx.moveTo(8, 28);
  ctx.lineTo(10, 42);
  ctx.stroke();

  ctx.strokeStyle = '#f0e0d0';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-13, 43);
  ctx.lineTo(-3, 43);
  ctx.moveTo(3, 43);
  ctx.lineTo(13, 43);
  ctx.stroke();

  // Платье
  ctx.fillStyle = '#faf0e6';
  ctx.beginPath();
  ctx.moveTo(-18, -2);
  ctx.quadraticCurveTo(0, -8, 18, -2);
  ctx.lineTo(26, 30);
  ctx.lineTo(-26, 30);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#f5e8dc';
  ctx.beginPath();
  ctx.moveTo(-14, 2);
  ctx.lineTo(14, 2);
  ctx.lineTo(18, 24);
  ctx.lineTo(-18, 24);
  ctx.closePath();
  ctx.fill();

  // Руки
  ctx.strokeStyle = '#f5dcc8';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-17, 6);
  ctx.lineTo(-28, 18);
  ctx.moveTo(17, 6);
  ctx.lineTo(28, 17);
  ctx.stroke();

  // Шея
  ctx.fillStyle = '#f5dcc8';
  ctx.fillRect(-4, -10, 8, 10);

  // Лицо
  ctx.fillStyle = '#f5dcc8';
  ctx.beginPath();
  ctx.arc(0, -26, 22, 0, Math.PI * 2);
  ctx.fill();

  // Уши
  ctx.fillStyle = '#f5dcc8';
  ctx.beginPath();
  ctx.arc(-20, -26, 4, 0, Math.PI * 2);
  ctx.arc(20, -26, 4, 0, Math.PI * 2);
  ctx.fill();

  // Волосы (светлые)
  ctx.fillStyle = '#f0d8a8';
  ctx.beginPath();
  ctx.arc(0, -34, 28, Math.PI * 0.92, Math.PI * 2.08);
  ctx.lineTo(22, -4);
  ctx.quadraticCurveTo(12, -10, 10, 0);
  ctx.quadraticCurveTo(0, -7, -9, 2);
  ctx.quadraticCurveTo(-14, -8, -24, -2);
  ctx.closePath();
  ctx.fill();

  // Чёлка
  ctx.fillStyle = '#f0d8a8';
  ctx.beginPath();
  ctx.moveTo(-22, -32);
  ctx.quadraticCurveTo(-14, -56, 0, -56);
  ctx.quadraticCurveTo(18, -55, 24, -36);
  ctx.quadraticCurveTo(13, -44, 7, -36);
  ctx.quadraticCurveTo(2, -45, -2, -35);
  ctx.quadraticCurveTo(-9, -44, -15, -34);
  ctx.closePath();
  ctx.fill();

  // Боковые пряди
  ctx.fillStyle = '#f0d8a8';
  ctx.lineCap = 'round';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(-18, -42);
  ctx.quadraticCurveTo(-26, -24, -20, -8);
  ctx.moveTo(18, -42);
  ctx.quadraticCurveTo(26, -24, 20, -8);
  ctx.stroke();

  // Лицо поверх
  ctx.fillStyle = '#f5dcc8';
  ctx.beginPath();
  ctx.arc(0, -25, 17, 0, Math.PI * 2);
  ctx.fill();

  // Глаза
  ctx.fillStyle = '#5b8db8';
  ctx.beginPath();
  ctx.arc(-6, -26, 3.5, 0, Math.PI * 2);
  ctx.arc(6, -26, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a2a3a';
  ctx.beginPath();
  ctx.arc(-6, -25, 1.8, 0, Math.PI * 2);
  ctx.arc(6, -25, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-5, -27, 1.2, 0, Math.PI * 2);
  ctx.arc(7, -27, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Румянец
  ctx.fillStyle = 'rgba(230,150,150,0.25)';
  ctx.beginPath();
  ctx.ellipse(-11, -20, 4, 2.5, 0, 0, Math.PI * 2);
  ctx.ellipse(11, -20, 4, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Улыбка
  ctx.strokeStyle = '#b07070';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(0, -19, 5, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // Бантик
  ctx.fillStyle = '#f0c8b0';
  ctx.beginPath();
  ctx.ellipse(-24, -48, 7, 4, -0.5, 0, Math.PI * 2);
  ctx.ellipse(-14, -48, 7, 4, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#dbb090';
  ctx.beginPath();
  ctx.arc(-19, -48, 2.2, 0, Math.PI * 2);
  ctx.fill();

  // Сачок
  ctx.strokeStyle = '#8a7a5a';
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(25, 12);
  ctx.lineTo(54, -26);
  ctx.stroke();
  ctx.strokeStyle = '#e8e0d0';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.ellipse(62, -36, 16, 12, -0.55, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(60,40,20,0.3)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(51, -43);
  ctx.lineTo(73, -29);
  ctx.moveTo(52, -30);
  ctx.lineTo(71, -43);
  ctx.stroke();

  // Цветочный венок
  const flowers = [
    [-16, -54, '#ffd8e8'],
    [-4, -60, '#fff2a8'],
    [10, -56, '#d9c7ff']
  ];
  flowers.forEach(([fx, fy, c]) => {
    ctx.fillStyle = c;
    for (let k = 0; k < 5; k++) {
      const a = k * Math.PI * 2 / 5;
      ctx.beginPath();
      ctx.arc(fx + Math.cos(a) * 5, fy + Math.sin(a) * 5, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#f0c85a';
    ctx.beginPath();
    ctx.arc(fx, fy, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // Имя
  roundRect(-44, -90, 88, 24, 6, 'rgba(255,248,240,0.9)', '#6a5a4a');
  ctx.fillStyle = '#4d3824';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Кристина', 0, -72);

  ctx.restore();
}

function draw() {
  drawDesert();

  capybaras.filter(Boolean).forEach(drawCapybara);
  drawPlayer();

  if (caughtAnim > 0) {
    ctx.fillStyle = `rgba(255,245,220,${caughtAnim / 30})`;
    ctx.font = 'bold 44px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 12;
    ctx.fillText('🐹 Поймана! +1', W / 2, 80);
    ctx.shadowBlur = 0;
    caughtAnim--;
  }
}

let last = performance.now();

function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;

  if (!activeFrog) {
    let dx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    let dy = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
    if (dx || dy) {
      const l = Math.hypot(dx, dy);
      dx /= l;
      dy /= l;
      player.x = Math.max(35, Math.min(W - 35, player.x + dx * player.speed * dt));
      player.y = Math.max(110, Math.min(H - 40, player.y + dy * player.speed * dt));
      if (dx) player.dir = dx;
    }

    for (const c of capybaras) {
      if (c && Math.hypot(player.x - c.x, player.y - c.y) < 60) {
        ask(c);
        break;
      }
    }
  }

  draw();
  requestAnimationFrame(loop);
}

function ask(c) {
  activeFrog = c;
  const a = c.id + 1;
  const b = selectedTable;
  question = { a, b };
  document.getElementById('example').textContent = `${a} × ${b} = ?`;
  document.getElementById('answer').value = '';
  document.getElementById('message').textContent = '';
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('answer').focus(), 120);
}

function submit() {
  const val = Number(document.getElementById('answer').value);
  const msg = document.getElementById('message');
  if (val === question.a * question.b) {
    score++;
    document.getElementById('score').textContent = score + '/10';
    const i = capybaras.indexOf(activeFrog);
    capybaras[i] = null;
    msg.textContent = '✅ Верно! Капибара поймана! 🎉';
    msg.style.color = '#4a7a3a';
    caughtAnim = 30;
    setTimeout(() => {
      closeModal();
      if (score === 10) finishLevel();
    }, 700);
  } else {
    msg.textContent = '❌ Неверно! Попробуй ещё раз 🐹';
    msg.style.color = '#a04030';
    setTimeout(closeModal, 900);
  }
}

function closeModal() {
  activeFrog = null;
  document.getElementById('modal').classList.add('hidden');
}

// Телефонное управление
document.querySelectorAll('#touchControls button').forEach(btn => {
  const key = btn.dataset.key;
  const start = e => { e.preventDefault(); keys[key] = true; };
  const stop = e => { e.preventDefault(); keys[key] = false; };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointercancel', stop);
  btn.addEventListener('pointerleave', stop);
});

// Кнопки таблицы
const numberChoices = document.getElementById('numberChoices');
for (let n = 1; n <= 10; n++) {
  const btn = document.createElement('button');
  btn.textContent = '×' + n;
  btn.onclick = () => startLevel(n);
  numberChoices.appendChild(btn);
}

document.getElementById('nextLevel').onclick = () => {
  document.getElementById('danceScreen').classList.add('hidden');
  document.getElementById('levelScreen').classList.remove('hidden');
};

document.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    keys[e.key] = true;
    e.preventDefault();
  }
  if (e.key === 'Enter' && activeFrog) submit();
});
document.addEventListener('keyup', e => {
  keys[e.key] = false;
});

document.getElementById('check').onclick = submit;

// Старт
document.getElementById('game').style.visibility = 'hidden';
requestAnimationFrame(loop);
</script>
</body>
</html>
